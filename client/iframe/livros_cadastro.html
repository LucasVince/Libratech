<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style-livro-cadastro.css">
    <link rel="stylesheet" href="style/loading.css">
    <script src="js/livros_cadastro.js" defer></script>
    <script src="js/modo_escuro.js" defer></script>
    <script src="js/loader.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Cadastro de Livros</h1>
        <form method="POST" id="from-cadastro">
            <label for="nome">Nome do Livro:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome do livro" required>

            <label for="autor">Autor:</label>
            <input type="text" id="autor" name="autor" placeholder="Digite o nome do autor" required>

            <label for="classificacao">Classificação:</label>
            <select id="classificacao" name="classificacao" required>
                <option value="" disabled selected>Selecione a classificação</option>
                <option value="infanto juvenil">Infanto Juvenil</option>
                <option value="ensino medio">Ensino Médio</option>
            </select>

            <label for="sinopse">Sinopse:</label>
            <textarea id="sinopse" name="sinopse" rows="3" placeholder="Digite a sinopse do livro"></textarea>

            <label for="genero">Genero:</label>
            <select id="genero" name="genero" required>
                <option value="" disabled selected>Selecione o Genero</option>
                <option value="romance">Romance</option>
                <option value="ficcao">Ficção</option>
                <option value="fantasia">Fantasia</option>
                <option value="suspense">Suspense</option>
                <option value="aventura">Aventura</option>
                <option value="historia">Historia</option>
                <option value="drama">Drama</option>
                <option value="terror">Terror</option>
            </select>

            <button type="submit" id="cadastrar">Cadastrar</button>
        </form>
    </div>
    <div id="loading-bg">
        <span id="loader"></span>
    </div>
</body>
</html>
